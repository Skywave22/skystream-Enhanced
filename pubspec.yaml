name: skystream
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 2.7.6+1

environment:
  sdk: ^3.13.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  expressive_loading_indicator: ^0.0.1

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  flutter_riverpod: ^3.4.3
  hooks_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  collection: ^1.18.0
  go_router: ^18.0.0
  dio: ^5.9.0
  cookie_jar: ^4.0.0
  flutter_inappwebview: ^6.0.0
  # No google_fonts: the type ramp is bundled under assets/fonts/ so the first
  # frame is typeset correctly with no network round trip. See the `fonts:`
  # section below.
  cached_network_image: ^4.0.0
  package_info_plus: any
  shared_preferences: ^2.5.4
  path_provider: ^2.1.5
  # Brightness is an OS-level control; libVLC has no equivalent.
  screen_brightness: ^2.1.7
  wakelock_plus: ^1.4.0
  hive_flutter: ^1.1.0
  flutter_js_ng:
    path: packages/flutter_js_ng
  # Held at 1.x. 2.0.0 swapped the library that derives the scheme, so
  # DynamicColorBuilder now hands back a material_ui ColorScheme rather
  # than Flutter's - main.dart:407,418 stop compiling, and AppTheme's
  # createLightTheme/createDarkTheme would both need adapting. Worth doing
  # with a side-by-side visual check of Material You pickup, not blind.
  dynamic_color: ^1.9.0
  window_manager: ^0.5.1
  device_info_plus: any
  crypto: ^3.0.7
  flutter_torrent_server:
    path: packages/flutter_torrent_server
  file_picker: ^13.1.0
  archive: ^4.0.7
  permission_handler: ^13.0.0
  url_launcher: ^6.3.2
  version: ^3.0.2
  open_file: ^4.0.0
  flutter_displaymode: ^0.7.0
  intl: ^0.20.2
  flutter_svg: ^2.2.3
  dpad: ^3.0.0
  shimmer: ^4.0.0
  # The player engine.
  vlc_player:
    path: packages/vlc_player
  flutter_cache_manager: ^3.4.1
  path: ^1.9.1
  http: ^1.6.0
  connectivity_plus: ^7.1.1
  html_unescape: ^2.0.0
  html: ^0.15.6
  # Held below 9.6.0, but no longer for the original reason. The old block
  # blamed the Kotlin serialization compiler plugin that 9.6.x pins at 2.3.20,
  # and the connectivity_plus ^6.1.3 requirement in 9.6.0; 9.6.1 widened that
  # to >=6.1.3 <8.0.0, and forcing the serialization plugin to match the
  # compiler is one line in android/settings.gradle.kts. Neither is the wall.
  #
  # 9.6.2's own Kotlin does not compile under Kotlin 2.4.20 (tried it: 49
  # errors across 9 of its source files - "Only safe (?.) or non-null asserted
  # calls are allowed on a nullable receiver of type 'String?'", argument type
  # mismatches, unresolved overloads). It is written against an older compiler,
  # and KGP cannot go back: 2.2.20 carries CVE-2026-53914 and is below the
  # version Flutter errors on. Revisit when the package supports Kotlin 2.4.
  background_downloader: ">=9.5.8 <9.6.0"
  flutter_hooks: ^0.21.3+1
  # Direct, and no longer capped: package:encrypt (last released 2023) was
  # the only thing holding this at 3.x, and 4.0.0 drops the discontinued
  # `js` package. AES lives in lib/core/extensions/engine/aes_decrypt.dart.
  pointycastle: ^4.0.0
  talker: ^5.1.16
  talker_flutter: ^5.1.16
  visibility_detector: ^0.4.0+2
  qr_flutter: ^4.1.0
  # Platform keychain/keystore for OAuth tokens (Trakt/Simkl/MAL/AniList).
  # Falls back to encrypted Hive on Linux/Windows where libsecret is missing.
  flutter_secure_storage: ^11.0.0
  flutter_volume_controller: ^2.0.2

dependency_overrides:
  # Keeps the upstream screen_brightness_windows out of the Windows build.
  #
  # That plugin drives DDC/CI (I²C over the display link) to read and write the
  # monitor's own brightness: once from its constructor at registration, and
  # again on every WM_DESTROY/WM_CLOSE, which — unlike its WM_SIZE and
  # WM_ACTIVATEAPP paths — is NOT gated by `is_auto_reset_`, so
  # `setAutoReset(false)` cannot switch it off. That close-time write is the
  # "SkyStream resets my screen brightness on Windows" users reported. It also
  # leaks a PHYSICAL_MONITOR handle per failed probe.
  #
  # Nothing is lost: the only caller of the brightness API returns early on
  # desktop (vlc_player_controls.dart, `if (_isDesktop) return;`). Android, iOS
  # and macOS keep the real implementation.
  #
  # See packages/screen_brightness_windows/README.md.
  screen_brightness_windows:
    path: packages/screen_brightness_windows

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Runs integration_test/ against a real engine on a real device or desktop
  # runner. `flutter test` alone cannot catch a native failure: it runs on
  # flutter_tester, where no plugin is registered, so nothing a plugin does at
  # startup is observable. Both of the worst bugs this project has shipped -
  # screen_brightness driving DDC/CI at the monitor, and WebView2 being handed
  # an unwritable user-data folder inside Program Files - were invisible to the
  # unit suite for exactly that reason, and compiled cleanly in CI.
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  # No custom_lint: riverpod_lint 3.x is an analysis_server_plugin and never
  # depended on it, so `dart run custom_lint` loaded zero plugins and every
  # riverpod rule was silently off. Its analyzer ^8.0.0 ceiling was also the
  # only sub-9 cap in the graph, pinning 17 packages (Riverpod included) below
  # their current releases. analysis_options.yaml wires riverpod_lint directly.
  riverpod_lint: ^3.1.9
  riverpod_generator: ^4.0.9
  build_runner: ^2.4.9
  go_router_builder: ^4.2.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  generate: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/plugins/
    - assets/images/
    # The licence text for the bundled type family, shown in the in-app
    # licence page (see AppTheme's LicenseRegistry entry).
    - assets/fonts/OFL.txt
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # The application type family, bundled rather than fetched.
  #
  # It used to be pulled from fonts.gstatic.com at runtime by google_fonts, so
  # a first launch without a network - a TV box before Wi-Fi is configured, a
  # plane, a captive portal - rendered the whole app in a fallback face, and
  # every first launch made a request to a third-party server before the user
  # had done anything.
  #
  # Outfit is licensed under the SIL Open Font License 1.1
  # (assets/fonts/OFL.txt), which permits redistribution inside an application.
  # Only the six weights the app actually asks for are shipped: 400/500/600/700
  # from the theme's text styles, 800/900 from widget-level overrides. Flutter
  # snaps any other FontWeight to the nearest one shipped.
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
        - asset: assets/fonts/Outfit-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Outfit-Black.ttf
          weight: 900
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
