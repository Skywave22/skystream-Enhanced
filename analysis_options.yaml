# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugin designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

# Top-level `plugins:`, not `analyzer: plugins:` - the latter is the legacy
# plugin system the analyzer now warns about. riverpod_lint 3.x ships as an
# analysis_server_plugin, so declared here its rules run under `dart analyze`
# and in the IDE. `flutter analyze` loads it as well, but reports only
# whichever of its findings arrive before the server's own analysis ends, so
# the "Riverpod Lint" step in .github/workflows/ci.yml, which runs
# `dart analyze`, is where they are gated. It was previously wired through
# custom_lint, which never loaded it at all, so none of these rules had ever
# run.
#
# Pinned exactly, not floated: the analysis server resolves this in its own
# plugin workspace, outside pubspec.lock, so a caret here means a future 3.x
# release can silently change which rules run with no commit in this repo.
#
# The plugin workspace resolves its packages from pub.dev independently of
# pubspec.lock. When analysis_server_plugin is resolved to a newer release
# than the one the bundled Dart SDK was built against (0.3.26 wants analyzer
# 14.7.0, Flutter 3.47.7 ships analyzer 14.5.0), the plugin's AOT snapshot is
# compiled against a different analyzer than the one loading it, and the
# analysis server crashes with exit code 4 - the linter never runs and the
# gate fails with nothing to read. Pin the plugin packages to the locked
# versions so the workspace resolves deterministically.
plugins:
  riverpod_lint: 3.1.9

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "packages/**"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # Off, not skipped: analyzer 14 started applying this to private fields, and
    # all 19 sites it flags here initialise a private field from a NAMED
    # parameter - `SubDLProvider({String? apiKey}) : _apiKey = apiKey`. The
    # suggested fix, `{this._apiKey}`, is legal Dart (verified on 3.13: the
    # field is private but the external parameter name stays `apiKey`, so call
    # sites are unchanged). Kept off for churn, not correctness - turning it on
    # is a 19-site mechanical edit someone should make deliberately.
    prefer_initializing_formals: false
    # Core Lints
    avoid_print: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_final_locals: true
    sized_box_for_whitespace: true
    use_key_in_widget_constructors: true
    prefer_const_literals_to_create_immutables: true
    unnecessary_string_interpolations: true
    # Architecture & Lifecycle Strictness
    use_build_context_synchronously: true
    unawaited_futures: true
    avoid_void_async: true
    prefer_final_in_for_each: true
    # discarded_futures: true  # 147 info-level sites; fix with unawaited() or await incrementally
#

# riverpod_lint's rules (missing_provider_scope, notifier_extends,
# provider_dependencies, avoid_public_notifier_properties,
# avoid_ref_inside_state_dispose, ...) are all on by default, so there is
# nothing to list here to switch them on. A false positive is suppressed at
# its site, with the reason. A plugin's diagnostics are filtered only by an
# ignore that names the plugin - a bare rule name does nothing:
#
#   // ignore: riverpod_lint/missing_provider_scope
