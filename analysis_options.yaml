# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugin designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  plugins:
    - custom_lint
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "packages/**"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # Core Lints
    avoid_print: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_final_locals: true
    sized_box_for_whitespace: true
    use_key_in_widget_constructors: true
    prefer_const_literals_to_create_immutables: true
    unnecessary_string_interpolations: true
    # Architecture & Lifecycle Strictness
    use_build_context_synchronously: true
    unawaited_futures: true
    avoid_void_async: true
    prefer_final_in_for_each: true
    # discarded_futures: true  # 147 info-level sites; fix with unawaited() or await incrementally
#

# The `custom_lint` plugin above is riverpod_lint. All 15 of its rules
# (missing_provider_scope, notifier_extends, provider_dependencies,
# avoid_public_notifier_properties, avoid_ref_inside_state_dispose, ...) are
# enabledByDefault, so there is nothing to list here to switch them on - a
# `custom_lint: rules:` block only ever overrides a default, and any name not
# in it keeps its default (custom_lint_core LintRule.isEnabled). This file used
# to name five rules that riverpod_lint 3.1.0 does not ship
# (riverpod_avoid_global_provider, riverpod_avoid_read_inside_build,
# riverpod_avoid_watch_outside_build, riverpod_notifier_parameters,
# riverpod_async_notifier_error_handling); they were inert, and they read as if
# the rule set were narrower than it is. Add an entry here only to turn a real
# rule off, e.g.
#
#   custom_lint:
#     rules:
#       - provider_dependencies: false
#
# `flutter analyze` does not load analyzer plugins, so none of these rules run
# unless `dart run custom_lint` does. The CI workflow runs it on every push and
# pull request (.github/workflows/ci.yml, the "Custom Lint" step).
