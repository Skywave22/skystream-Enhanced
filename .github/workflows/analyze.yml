name: Analyze

# Static analysis gate for feature work: resolves deps, regenerates the
# Riverpod/GoRouter/l10n sources and runs `flutter analyze`.
on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
  pull_request:
  workflow_dispatch:

jobs:
  analyze:
    name: Flutter analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      # The repository has a few pre-existing warnings; this gate is about
      # catching real compile errors introduced by a change.
      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos \
            | tee analyze.log
          if grep -q "error •" analyze.log; then
            echo "::error::Analyzer reported errors"
            exit 1
          fi
