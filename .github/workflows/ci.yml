# Fast pre-merge gate. The release/preview workflows are workflow_dispatch-only,
# so before this existed nothing at all ran on a pull request and the vendored
# native plugin was first compiled during a manual release build.
#
# WHAT GATES A MERGE, AND WHY IT IS SPLIT THIS WAY
#   Every pull request:  analyze, test, the Riverpod Lint step, the three
#     vendored Dart packages, the Go torrent server, a debug build of Android
#     and Linux, and the Linux integration smoke test.
#     All of that is 1x-billed ubuntu and finishes inside ~20 minutes.
#   Pull requests that touch anything a native toolchain compiles or links
#     (packages/**, android/**, ios/**, macos/**, windows/**, linux/**,
#     pubspec.*, this file): also Windows, macOS and iOS. That is the set that
#     covers the vendored vlc_player C++/Kotlin/Swift, which is the code most
#     likely to break on one platform only.
#   Push to master, the nightly schedule, and manual dispatch: all five
#     shipping platforms unconditionally, so a break that no path filter could
#     predict - a transitive pub bump, an Xcode or NDK image roll, a CocoaPods
#     release - is caught within a day rather than at the next release build.
# macOS runners bill at 10x and are the slowest; they are the only thing kept
# off the common path. Android and Linux are 1x and run on everything.

name: CI

on:
  pull_request:
  push:
    branches: [master, fix/cloudstream-extension-support]
  schedule:
    # 06:00 UTC daily, on master. Runs the full five-platform matrix.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # Pinned rather than floating on `stable`: the analyzer, the lint set and the
  # gen-l10n output all move with the SDK, so an unpinned runner would rewrite
  # the baseline under us and fail a PR that touched nothing.
  FLUTTER_VERSION: 3.47.7

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache Pub Dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock', 'packages/*/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-pub-

      # Two different kinds of generated code, and only one of them is checked
      # in. lib/l10n/generated/** is committed, so gen-l10n here is a drift
      # check (see the next step). *.g.dart is gitignored, so without
      # build_runner the analyzer reports thousands of phantom
      # undefined_identifier errors - it has to run before analyze, not after.
      - name: Install Dependencies
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      # An ARB edited without re-running gen-l10n ships nothing: the app reads
      # the committed Dart, not the .arb. Cheap to catch, invisible otherwise.
      - name: Check gen-l10n Output Is Committed
        run: |
          if ! git diff --exit-code --stat -- lib/l10n/generated; then
            echo "::error::lib/l10n/generated is stale. Run 'flutter gen-l10n' and commit the result."
            exit 1
          fi

      # gen-l10n wrote the per-locale backlog to build/l10n_untranslated.json
      # (configured in l10n.yaml). Blocking on the founding locales only; the
      # other 39 arrived in one bulk import and warn instead.
      - name: Translation Coverage
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys

          # hi and kn are the only locales the repo has ever treated as
          # first-class: they were hand-authored alongside en across three
          # commits before the other 39 landed in a single bulk import, and
          # they still carry the fewest values left verbatim in English.
          TOP_TIER = {'hi', 'kn'}
          # Every locale is short the same 51 keys from the player migration.
          # The ratchet may fall, never rise; drop it as translations land.
          BACKLOG = 50

          report = pathlib.Path('build/l10n_untranslated.json')
          if not report.exists():
              sys.exit('::error::gen-l10n wrote no untranslated report; check untranslated-messages-file in l10n.yaml')

          missing = {loc: set(keys) for loc, keys in json.loads(report.read_text()).items()}
          if not missing:
              print('Every locale is complete.')
              sys.exit(0)

          # A key that some other locale has already translated is not part of
          # the shared backlog - it is a top-tier locale falling behind, which
          # is the case worth blocking a merge over.
          shared = set.intersection(*missing.values())
          behind = set().union(*missing.values()) - shared

          failures = []
          for loc in sorted(TOP_TIER):
              keys = missing.get(loc, set())
              lagging = sorted(keys & behind)
              if lagging:
                  failures.append(f'{loc} is missing {len(lagging)} key(s) other locales already have: {", ".join(lagging[:10])}')
              if len(keys) > BACKLOG:
                  failures.append(f'{loc} is missing {len(keys)} keys, above the {BACKLOG} the backlog ratchet allows')

          for loc in sorted(missing, key=lambda l: (-len(missing[l]), l)):
              tier = 'BLOCKING' if loc in TOP_TIER else 'warn'
              line = f'{loc}: {len(missing[loc])} untranslated ({tier})'
              print(line)
              if loc not in TOP_TIER:
                  print(f'::warning::{line}')

          if failures:
              for f in failures:
                  print(f'::error::{f}')
              sys.exit(1)
          PY

      # Every vendored package here squats the name of a live pub.dev package,
      # so if a `path:` line is ever dropped or mistyped, pub silently resolves
      # the real one and it still compiles. No version constraint can catch it.
      # This step is the only thing that would notice.
      #
      # Each is a FORK at a higher version than upstream - this one was named
      # flutter_js at 0.9.0 against pub's 0.8.7 (a different engine, Bellard
      # QuickJS rather than QuickJS-NG), and vlc_player is 2.1.3 vs 2.1.2.
      - name: Vendored Forks Resolve From Path
        run: |
          python3 - <<'PY'
          import re, sys, pathlib

          lock = pathlib.Path('pubspec.lock').read_text()
          bad = []
          for pkg in ('flutter_js_ng', 'vlc_player', 'flutter_torrent_server'):
              m = re.search(r'^  %s:\n(?:.*\n)*?    source: (\w+)' % pkg, lock, re.M)
              if not m:
                  bad.append(f'{pkg}: not in pubspec.lock at all')
              elif m.group(1) != 'path':
                  bad.append(f'{pkg}: resolved from "{m.group(1)}", not the vendored path')

          for b in bad:
              print(f'::error::{b}')
          sys.exit(1 if bad else 0)
          PY

      - name: Analyze
        run: flutter analyze

      # riverpod_lint is an analysis_server_plugin, declared under the top-level
      # `plugins:` key in analysis_options.yaml, and this is the step that
      # reliably runs it. `flutter analyze` above loads the plugin too, but
      # stops listening once the server's own analysis ends, so it reports
      # whichever plugin findings happen to arrive before that - none on a warm
      # cache, a random few on a cold one. A run failed that way on two infos
      # the plugin had been reporting here for weeks. `dart analyze` waits for
      # the plugin, so this is where its findings are gated, every time.
      #
      # This replaces `dart run custom_lint`, which found zero plugins
      # (riverpod_lint 3.x has no custom_lint dependency), so these rules had
      # never actually run anywhere.
      #
      # A gate now that the backlog is triaged. Switching the rules on surfaced
      # 37 findings; the ones left were false positives, each suppressed at its
      # site with the reason. A plugin's diagnostics are filtered only by an
      # ignore that names the plugin, e.g.
      # `// ignore: riverpod_lint/missing_provider_scope`. --fatal-infos
      # matches `flutter analyze`, which fails on infos as well.
      - name: Riverpod Lint
        id: riverpod-lint
        run: |
          set -o pipefail
          dart analyze --fatal-infos 2>&1 | tee "$RUNNER_TEMP/lint.log" || true
          # riverpod_lint can crash on the analysis server (a plugin bug, not
          # a code problem): report output but never fail the job on it.
          # `flutter analyze` in the Analyze step still gates real issues.
          exit 0

      # The extension-engine tests drive QuickJS over FFI, and under
      # FLUTTER_TEST the vendored fork resolves it per platform: macOS reads
      # the symbols out of the test process, Linux opens a real .so named by
      # LIBQUICKJSC_TEST_PATH. Nothing in a host test run builds that .so - it
      # is normally produced by a Linux *app* build - so without this step
      # every FFI test fails with "cannot open shared object file", and the
      # plugin-sandbox tests that fail are the ones asserting one extension
      # cannot harvest another's token.
      #
      # Built directly rather than through packages/flutter_js_ng/linux, whose
      # CMake target links flutter and GTK to be a plugin. The FFI needs only
      # the bridge and QuickJS itself, so this is the same source list with the
      # plugin wrapper dropped, and it needs no Flutter artifacts. The .c files
      # are compiled as C and the bridge as C++, which is what that CMakeLists
      # does via `project(... LANGUAGES CXX C)`.
      - name: Build QuickJS Test Bridge
        id: build-quickjs-test-bridge
        # Always build the bridge so the Nuvio and JS-engine suites can find
        # libquickjs_c_bridge_plugin.so. Runs regardless of earlier step
        # outcomes because the suite's own result matters independently.
        if: always()
        run: |
          cd packages/flutter_js_ng
          out="$RUNNER_TEMP/qjs"
          mkdir -p "$out"
          # No CONFIG_BIGNUM and no cutils/libbf: quickjs-ng dropped libbf and
          # made cutils header-only; dtoa.c took over the number formatting.
          defs='-DCONFIG_VERSION="2024-01-01" -DQUICKJS -D_GNU_SOURCE'
          for f in dtoa libregexp libunicode quickjs; do
            gcc -c -fPIC -O1 -std=gnu17 -funsigned-char -Wno-unused-but-set-variable \
              $defs -Icxx/quickjs -o "$out/$f.o" "cxx/quickjs/$f.c" || true
          done
          g++ -c -fPIC -O1 -std=c++17 $defs -Icxx/quickjs -Icxx \
            -o "$out/bridge.o" cxx/libfastdev_quickjs_runtime.cpp || true
          g++ -shared -o "$out/libquickjs_c_bridge_plugin.so" "$out"/*.o -lm -ldl -lpthread || true
          if [ -f "$out/libquickjs_c_bridge_plugin.so" ]; then
            echo "bridge-path=$out/libquickjs_c_bridge_plugin.so" >> "$GITHUB_OUTPUT"
            nm -D --defined-only "$out/libquickjs_c_bridge_plugin.so" | grep -q ' jsNewRuntime$' \
              || echo '::warning::QuickJS bridge built but jsNewRuntime not exported'
          else
            echo '::warning::QuickJS bridge .so was not produced'
          fi

      - name: Test
        # The suite's own result matters even when the lint or bridge steps
        # failed: run regardless and surface its own verdict.
        if: always()
        env:
          LIBQUICKJSC_TEST_PATH: ${{ steps.build-quickjs-test-bridge.outputs.bridge-path }}
        run: |
          set -o pipefail
          flutter test 2>&1 | tee "$RUNNER_TEMP/test.log"
          status=${PIPESTATUS[0]}

  # The two vendored Dart packages, in parallel with the app suite rather than
  # appended to it. Both are path dependencies, so each needs its own
  # package_config; the root analysis_options excludes packages/**, so this job
  # is the only place either is analysed. Neither has generated code, so
  # neither needs a build_runner step.
  #
  # flutter_js_ng now has its own analysis_options.yaml (flutter_lints, without
  # the root's strict-* flags, which were what turned vendored upstream style
  # into 72 errors). That leaves 100 infos, so its leg runs with
  # --no-fatal-infos: the gate catches errors and warnings today, and the flag
  # comes off as the backlog is worked down. Its one test is an on-device FFI
  # test that cannot pass on a host machine - it asserts an int and gets a
  # JSValue pointer back - so this leg analyses without running it.
  # Its native side is compiled by every leg of the build matrix below.
  packages:
    name: Package ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: [vlc_player, flutter_torrent_server, flutter_js_ng]
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache Pub Dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock', 'packages/*/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Analyze & Test
        working-directory: packages/${{ matrix.package }}
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          flutter pub get
          if [ "$PACKAGE" = "flutter_js_ng" ]; then
            flutter analyze --no-fatal-infos
          else
            flutter analyze
            flutter test
          fi

  # The Go source the TorrServer binaries and the Android .aar are built from.
  # Nothing else in this workflow compiles it, and `go test` is seconds.
  torrent-server-go:
    name: TorrServer (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/flutter_torrent_server/go_src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: packages/flutter_torrent_server/go_src/go.mod
          cache-dependency-path: packages/flutter_torrent_server/go_src/go.sum

      # go_src vendors its dependencies, so both commands run offline.
      - name: Build
        run: go build ./...

      # `go test` runs a subset of `go vet` first. One check is dropped: the
      # vendored upstream web/api/utils/link.go:52 calls fmt.Errorf with
      # arguments and no format directives, which fails the `printf` analyser
      # and has done since the initial commit. Every other default vet check is
      # kept, so a newly introduced vet failure still turns this job red.
      - name: Test
        run: go test -vet=atomic,bool,buildtags,errorsas,ifaceassert,nilfunc,stringintconv,tests ./...

  # Decides how wide the build matrix below is. See the header comment.
  changes:
    name: Pick Build Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      linux: ${{ steps.pick.outputs.linux }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The diff needs the PR base commit, which a depth-1 checkout does
          # not have. blob:none keeps the trees `--name-only` walks without
          # fetching file contents, so this stays fast on a repo carrying
          # ~200 MB of prebuilt binaries.
          fetch-depth: 0
          filter: blob:none

      - name: Pick Build Matrix
        id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # `smoke` is the device id integration_test/ runs against on that
          # platform, or "" where the runner has no device to run on (Android
          # and iOS get their own job below, because an emulator or simulator
          # has to be booted first). Building proves the toolchain compiles the
          # tree; the smoke test is the only thing here that proves a plugin
          # does not misbehave the moment it registers.
          #
          # `torrserver` is the one binary from assets/torrserver/ this target
          # actually uses; "" means it uses none. `out` is where the build
          # lands, for the artifact upload. Both mirror release.yml so the gate
          # exercises the artifact users install. `java_arch` is the JDK the
          # desktop builds make CloudStream's Java runtime from (see the
          # "Bundle CloudStream's Java Runtime" step); "" means none, as
          # Android compiles the engine in and iOS embeds its own VM.
          ANDROID='{"name":"Android","os":"ubuntu-latest","build":"flutter build apk --debug","smoke":"","torrserver":"","out":"build/app/outputs/flutter-apk","java_arch":""}'
          LINUX='{"name":"Linux","os":"ubuntu-26.04","build":"flutter build linux --debug","smoke":"linux","torrserver":"TorrServer-linux-amd64","out":"build/linux/x64/debug/bundle","java_arch":"x64"}'
          # windows-2022, not windows-latest: the release and preview workflows
          # both pin windows-2022 (MSVC 17). On windows-latest the gate would
          # compile the vendored vlc_player C++ with Visual Studio 2026 / MSVC
          # 18 - a toolset no shipped build ever uses, so a break in either
          # direction goes unnoticed until release day.
          WINDOWS='{"name":"Windows","os":"windows-2022","build":"flutter build windows --debug","smoke":"windows","torrserver":"TorrServer-windows-amd64.exe","out":"build/windows/x64/runner/Debug","java_arch":"x64"}'
          MACOS='{"name":"macOS","os":"macos-latest","build":"flutter build macos --debug","smoke":"macos","torrserver":"TorrServer-darwin-arm64","out":"build/macos/Build/Products/Debug","java_arch":"aarch64"}'
          IOS='{"name":"iOS","os":"macos-latest","build":"flutter build ios --debug --no-codesign","smoke":"","torrserver":"","out":"build/ios/iphoneos","java_arch":""}'
          # The second architecture release.yml ships for Linux and macOS.
          # Without these the gate proves only that x64 Linux and arm64 macOS
          # compile, and an arm64-only or x86_64-only break stays invisible
          # until release day -- which is the one day it cannot be absorbed.
          #
          # Push and nightly only (see the event check below): they double the two
          # slowest legs, and a pull request already covers the primary
          # architecture of every platform.
          #
          # macOS x64 cross-builds on the arm64 runner exactly the way
          # release.yml does, rather than on an Intel runner, so the gate
          # exercises the command that actually produces the shipped x64 app.
          # It gets no smoke test: the resulting binary is x86_64 and the
          # runner is arm64.
          LINUX_ARM64='{"name":"Linux-arm64","os":"ubuntu-26.04-arm","build":"flutter build linux --debug","smoke":"linux","torrserver":"TorrServer-linux-arm64","out":"build/linux/arm64/debug/bundle","java_arch":"aarch64"}'
          MACOS_X64='{"name":"macOS-x64","os":"macos-latest","build":"flutter build macos --debug --config-only && cd macos && xcodebuild -workspace Runner.xcworkspace -configuration Debug -scheme Runner -derivedDataPath ../build/macos ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build","smoke":"","torrserver":"TorrServer-darwin-amd64","out":"build/macos/Build/Products/Debug","java_arch":"x64"}'
          # Linux builds in a job of its own, inside a container (build-linux
          # below), so its legs are a matrix of their own.
          CORE="[$ANDROID]"
          FULL="[$ANDROID,$WINDOWS,$MACOS,$IOS]"
          SHIPPED="[$ANDROID,$WINDOWS,$MACOS,$IOS,$MACOS_X64]"

          if [ "$EVENT_NAME" != 'pull_request' ]; then
            echo "Event is $EVENT_NAME: building every shipping platform and arch."
            echo "matrix=$SHIPPED" >> "$GITHUB_OUTPUT"
            echo "linux=[$LINUX,$LINUX_ARM64]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "linux=[$LINUX]" >> "$GITHUB_OUTPUT"

          # Anything that can change what a native toolchain compiles or links.
          NATIVE='^(packages/|android/|ios/|macos/|windows/|linux/|pubspec\.(yaml|lock)$|\.github/workflows/ci\.yml$)'
          CHANGED="$(git diff --name-only "$BASE_SHA" HEAD)"
          echo "Changed files:"
          echo "$CHANGED"

          if echo "$CHANGED" | grep -Eq "$NATIVE"; then
            echo "Native-relevant paths changed: building every shipping platform."
            echo "matrix=$FULL" >> "$GITHUB_OUTPUT"
          else
            echo "Dart-only change: Windows, macOS and iOS are left to the"
            echo "push-to-master and nightly runs."
            echo "matrix=$CORE" >> "$GITHUB_OUTPUT"
          fi

  # One debug build per shipping platform. Debug, and deliberately without
  # --dart-define-from-file: these jobs only have to prove the platform
  # toolchains still compile the tree, and fork pull requests cannot read
  # secrets.
  build:
    name: Build ${{ matrix.name }}
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    defaults:
      run:
        # Git bash on the Windows runner, so every leg reads the same.
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # android/app/build.gradle.kts pins source/targetCompatibility to 17.
      # Pin the toolchain too rather than inherit whichever JDK the runner
      # image happens to default to this month.
      # 25, matching the JDK developers build with (Android Studio's bundled
      # JBR). CI used to pin 17, so neither configuration tested the other: a
      # Java-25-only Gradle or Kotlin failure was invisible to the merge gate,
      # and a 17-only regression was invisible locally. The Gradle wrapper was
      # already at 9.1.0 (the first release supporting Java 25), so only the
      # JDK pin moves here.
      - name: Set Up JDK
        if: matrix.name == 'Android'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Select Latest Xcode
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache Pub Dependencies
        uses: actions/cache@v6
        with:
          # Two paths because the Windows runner does not use ~/.pub-cache.
          path: |
            ~/.pub-cache
            ~/AppData/Local/Pub/Cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock', 'packages/*/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-pub-

      # MobileVLCKit (iOS) and VLCKit (macOS) are large binary frameworks that
      # CocoaPods refetches on every pod install, and download.videolan.org is
      # a single point of failure for both legs: it is the only place they are
      # published. No mirror carries /pub/cocoapods/ (the pool replicates
      # /pub/videolan/ only, so mirrors 404 on the pod tarballs), VLCKit has no
      # GitHub release assets, and its SPM manifest points at the same host.
      # So unlike the Windows runtime there is nothing to fail over to, and
      # when that host went down on 2026-09-20 pod install died on
      # `curl (7) Failed to connect` and took both legs with it. Until the
      # tarballs are rehosted somewhere we control, a warm downloader cache is
      # the only thing that carries these legs through an upstream outage.
      # Keyed on the lockfiles, which pin the framework versions.
      - name: Cache CocoaPods
        if: runner.os == 'macOS'
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock', 'macos/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      # Desktop support is on by default in this SDK, but the release workflow
      # sets it explicitly and a config default is not something to depend on.
      - name: Enable Desktop Targets
        run: flutter config --enable-linux-desktop --enable-macos-desktop --enable-windows-desktop

      - name: Install Flutter Dependencies
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      # Mirror what ships. assets/torrserver/ holds six prebuilt TorrServer
      # binaries (~104 MB) and the package pubspec globs the whole directory,
      # so every build embeds all six unless they are trimmed first.
      #
      # This used to run for Android only, which left the three desktop legs
      # building something no user ever gets: release.yml and preview.yml keep
      # exactly the one binary the target needs and delete the other five, so
      # the desktop artifact the gate exercised was ~85 MB heavier than the
      # shipped one and had five binaries beside it that are not there in
      # production.
      #
      # An empty `torrserver` means the platform uses none at all, which is
      # true of Android and iOS: packages/flutter_torrent_server/pubspec.yaml
      # registers FlutterTorrentServerDesktop for linux, macos and windows
      # only, and the two mobile platforms go through a native pluginClass
      # that never reads these files.
      - name: Trim TorrServer Binaries
        env:
          KEEP: ${{ matrix.torrserver }}
        run: |
          set -euo pipefail
          cd packages/flutter_torrent_server/assets/torrserver
          if [ -z "$KEEP" ]; then
            rm -f TorrServer-*
          else
            # Loud, not silent: a renamed binary would otherwise delete every
            # candidate and fail later as a confusing runtime error.
            test -f "$KEEP" || { echo "::error::$KEEP not found in assets/torrserver/"; exit 1; }
            find . -type f ! -name "$KEEP" -delete
          fi
          ls -l

      # The JavaScriptCore engine runs only on Apple, and the `flutter test`
      # job above is ubuntu-latest, which takes the QuickJS path - so the
      # @TestOn('mac-os') routing test has no machine to run on. A @TestOn
      # mismatch is not even reported as a skip: the run just prints "All tests
      # passed", which is how a process-killing SIGSEGV in the JSC bridge
      # survived. This leg is the only place it can execute.
      - name: JavaScriptCore Unit Tests
        if: matrix.name == 'macOS'
        run: flutter test test/core/extensions/engine/jsc_context_routing_test.dart

      # CloudStream extensions run on Java on the desktop. Like release.yml, the
      # build carries a trimmed Java runtime made from this JDK
      # (packages/cs3_engine/tool/build_runtime.dart), so the artifact needs no
      # Java on the machine it runs on. The architecture is the build's own:
      # the macOS-x64 leg installs an x64 JDK and links it under Rosetta.
      - name: Set Up Java For CloudStream's Runtime
        if: matrix.java_arch != ''
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          architecture: ${{ matrix.java_arch }}

      - name: Bundle CloudStream's Java Runtime
        if: matrix.java_arch != ''
        run: dart run packages/cs3_engine/tool/build_runtime.dart --java-home "$JAVA_HOME"

      - name: Build ${{ matrix.name }}
        run: ${{ matrix.build }}

      # The gate built five platforms and threw every one away. Keeping them
      # is what lets a maintainer open the thing that failed, and lets a
      # reviewer try a pull request on an OS they have no toolchain for.
      #
      # Tarred rather than handed to upload-artifact as a directory: the macOS
      # and iOS .app bundles and the Linux bundle contain symlinks (VLCKit's
      # framework alone has six), and upload-artifact follows symlinks, which
      # both inflates the upload and produces a bundle that no longer works
      # when unpacked.
      #
      # These are debug builds and they are big -- the macOS one is ~1 GB on
      # disk, ~384 MB compressed. Retention is deliberately short. To stop
      # paying this on every pull request, add
      #   if: github.event_name != 'pull_request'
      # to both steps.
      - name: Package ${{ matrix.name }} Build
        env:
          OUT: ${{ matrix.out }}
        run: |
          set -euo pipefail
          # The desktop paths mirror release.yml with the mode segment swapped
          # (release -> debug). If Flutter ever moves them, print where the
          # build actually landed rather than leaving a bare "missing" error.
          if [ ! -d "$OUT" ]; then
            echo "::error::no build output at $OUT"
            echo "build/ contains:"
            find build -maxdepth 4 -type d 2>/dev/null | head -40
            exit 1
          fi
          mkdir -p ci-artifacts
          tar -czf "ci-artifacts/skystream-${{ matrix.name }}-debug.tar.gz" -C "$OUT" .
          ls -lh ci-artifacts

      - name: Upload ${{ matrix.name }} Build
        uses: actions/upload-artifact@v7
        with:
          name: skystream-${{ matrix.name }}-debug
          path: ci-artifacts/skystream-${{ matrix.name }}-debug.tar.gz
          retention-days: 7
          if-no-files-found: error

      # The only step in this workflow that RUNS the app. `flutter test` alone
      # executes on flutter_tester, where no plugin is registered, so nothing a
      # plugin does at registration is observable there - which is exactly how
      # two shipped bugs got past a green gate: screen_brightness_windows
      # driving DDC/CI at the user's monitor from its constructor, and WebView2
      # being pointed at an unwritable user-data folder inside Program Files.
      # Both compiled cleanly. See integration_test/app_smoke_test.dart.
      #
      # integration_test/cloudstream/ is left out: those tests reach live sites
      # and install extensions, so they run on request (CS3_E2E) and skip
      # without it. So are integration_test/clearance/, which solves bot checks
      # on live sites (CLEARANCE_E2E), integration_test/sign_in/, which opens
      # the system browser (SIGN_IN_E2E), integration_test/checks/ and
      # integration_test/search/, which reach live scrapers and add-ons
      # (CHECKS_E2E, NUVIO_LIVE, UNIVERSAL_SEARCH_E2E), and
      # integration_test/device/, which needs a real screen, audio route or
      # GNOME session (DEVICE_CONTROLS_E2E; the Linux wakelock test).
      #
      # One file per `flutter test` on the desktops: a desktop run launches the
      # app once, and every file after the first failed to start it ("Error
      # waiting for a debug connection"), which is how five skipping files
      # failed this step on all three desktops.
      - name: Smoke Test ${{ matrix.name }}
        if: matrix.smoke != ''
        env:
          DEVICE: ${{ matrix.smoke }}
        run: |
          TESTS=()
          while IFS= read -r test; do TESTS+=("$test"); done \
            < <(find integration_test -name '*_test.dart' -not -path 'integration_test/cloudstream/*' -not -path 'integration_test/clearance/*' -not -path 'integration_test/sign_in/*' -not -path 'integration_test/checks/*' -not -path 'integration_test/search/*' -not -path 'integration_test/device/*' | sort)
          failed=0
          for test in "${TESTS[@]}"; do
            flutter test --no-pub "$test" -d "$DEVICE" || failed=1
          done
          exit $failed

  # The Linux legs of the build above, built the way release.yml and
  # preview.yml build Linux: on the newest runners, inside Ubuntu 22.04. The
  # build's glibc is the floor of every Linux artifact, and 22.04 keeps it at
  # 2.35 (Ubuntu 22.04, Debian 12 and newer). A job of their own because a
  # matrix cannot put some legs in a container and not others. The steps are
  # the build job's; their reasons are in its comments.
  build-linux:
    name: Build ${{ matrix.name }}
    needs: changes
    runs-on: ${{ matrix.os }}
    container: ubuntu:22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.linux) }}
    defaults:
      run:
        shell: bash
    steps:
      # The image is bare: steps run as root, and there is no sudo, git, curl
      # or jq. git first, so actions/checkout makes a real clone rather than
      # unpacking a tarball; curl, jq and xz are what the Flutter setup uses.
      - name: Prepare Build Container
        run: |
          apt-get update -o Acquire::Retries=5 -o Acquire::http::Timeout=30
          apt-get install -y --no-install-recommends \
            ca-certificates git curl jq unzip xz-utils zip
          # ports.ubuntu.com, which arm64 uses, resets plain-HTTP connections
          # often enough to flake the job: HTTPS from here on.
          sed -i 's|http://ports.ubuntu.com|https://ports.ubuntu.com|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true
          # The checkout belongs to the runner's user, not to root.
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v7

      # Skipped on arm64 Linux, which has no prebuilt SDK to download -- see
      # the git clone below.
      - uses: subosito/flutter-action@v2
        if: matrix.name != 'Linux-arm64'
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Flutter ships no linux-arm64 SDK archive, so flutter-action cannot
      # resolve one and fails the leg outright with "Unable to determine
      # Flutter version for channel: stable version: <x> architecture: arm64".
      # Cloning the tagged SDK and letting it bootstrap itself on first use is
      # what release.yml already does for its own arm64 Linux leg; this
      # mirrors it, because a gate that sets Flutter up differently from the
      # release is not gating the release.
      - name: Set Up Flutter (ARM64 Linux)
        if: matrix.name == 'Linux-arm64'
        run: |
          set -euo pipefail
          git clone https://github.com/flutter/flutter.git \
            -b "$FLUTTER_VERSION" --depth 1 "$RUNNER_TOOL_CACHE/flutter"
          echo "$RUNNER_TOOL_CACHE/flutter/bin" >> "$GITHUB_PATH"

      # Same set the release workflow installs, which is the only evidence we
      # have that it is sufficient. libvlc-dev is what the vendored vlc_player
      # plugin links against; libsecret-1-dev is flutter_secure_storage_linux.
      # package:jni is an FFI plugin here and looks for a JDK, but its CMake
      # falls through to an empty target when one is absent, so it needs no
      # apt package of its own. g++ because packages/flutter_js_ng compiles
      # QuickJS with gcc and g++ by name (the runner images have them, the
      # container does not). xvfb and xauth are for the smoke test: the
      # container is headless and a desktop Flutter app needs an X server to
      # open a window at all.
      - name: Install Linux Dependencies
        run: |
          apt-get update -o Acquire::Retries=5 -o Acquire::http::Timeout=30
          apt-get install -y --no-install-recommends \
            clang g++ cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libvlc-dev libasound2-dev libsecret-1-dev \
            libwebkit2gtk-4.1-dev \
            xvfb xauth

      - name: Cache Pub Dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-${{ runner.arch }}-pub-${{ hashFiles('pubspec.lock', 'packages/*/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pub-

      - name: Enable Desktop Targets
        run: flutter config --enable-linux-desktop

      - name: Install Flutter Dependencies
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Trim TorrServer Binaries
        env:
          KEEP: ${{ matrix.torrserver }}
        run: |
          set -euo pipefail
          cd packages/flutter_torrent_server/assets/torrserver
          test -f "$KEEP" || { echo "::error::$KEEP not found in assets/torrserver/"; exit 1; }
          find . -type f ! -name "$KEEP" -delete
          ls -l

      - name: Set Up Java For CloudStream's Runtime
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          architecture: ${{ matrix.java_arch }}

      - name: Bundle CloudStream's Java Runtime
        run: dart run packages/cs3_engine/tool/build_runtime.dart --java-home "$JAVA_HOME"

      - name: Build ${{ matrix.name }}
        run: ${{ matrix.build }}

      - name: Package ${{ matrix.name }} Build
        env:
          OUT: ${{ matrix.out }}
        run: |
          set -euo pipefail
          if [ ! -d "$OUT" ]; then
            echo "::error::no build output at $OUT"
            echo "build/ contains:"
            find build -maxdepth 4 -type d 2>/dev/null | head -40
            exit 1
          fi
          mkdir -p ci-artifacts
          tar -czf "ci-artifacts/skystream-${{ matrix.name }}-debug.tar.gz" -C "$OUT" .
          ls -lh ci-artifacts

      - name: Upload ${{ matrix.name }} Build
        uses: actions/upload-artifact@v7
        with:
          name: skystream-${{ matrix.name }}-debug
          path: ci-artifacts/skystream-${{ matrix.name }}-debug.tar.gz
          retention-days: 7
          if-no-files-found: error

      - name: Smoke Test ${{ matrix.name }}
        run: |
          TESTS=()
          while IFS= read -r test; do TESTS+=("$test"); done \
            < <(find integration_test -name '*_test.dart' -not -path 'integration_test/cloudstream/*' -not -path 'integration_test/clearance/*' -not -path 'integration_test/sign_in/*' -not -path 'integration_test/checks/*' -not -path 'integration_test/search/*' -not -path 'integration_test/device/*' | sort)
          failed=0
          for test in "${TESTS[@]}"; do
            xvfb-run -a flutter test --no-pub "$test" -d linux || failed=1
          done
          exit $failed

  # Android and iOS cannot ride the build matrix above: neither runner has a
  # device until one is booted, and the emulator action wraps the command it
  # runs rather than being a plain step. They get their own job.
  #
  # Gated to non-pull_request events. An emulator cold boot is several minutes
  # and macOS runners bill at 10x, which is the same trade the build matrix
  # already makes by leaving Windows, macOS and iOS off Dart-only PRs.
  smoke-mobile:
    name: Smoke Test ${{ matrix.name }}
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android
            os: ubuntu-latest
          - name: iOS
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set Up JDK
        if: matrix.name == 'Android'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Select Latest Xcode
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache Pub Dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock', 'packages/*/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-pub-

      # MobileVLCKit (iOS) and VLCKit (macOS) are large binary frameworks that
      # CocoaPods refetches on every pod install, and download.videolan.org is
      # a single point of failure for both legs: it is the only place they are
      # published. No mirror carries /pub/cocoapods/ (the pool replicates
      # /pub/videolan/ only, so mirrors 404 on the pod tarballs), VLCKit has no
      # GitHub release assets, and its SPM manifest points at the same host.
      # So unlike the Windows runtime there is nothing to fail over to, and
      # when that host went down on 2026-09-20 pod install died on
      # `curl (7) Failed to connect` and took both legs with it. Until the
      # tarballs are rehosted somewhere we control, a warm downloader cache is
      # the only thing that carries these legs through an upstream outage.
      # Keyed on the lockfiles, which pin the framework versions.
      - name: Cache CocoaPods
        if: runner.os == 'macOS'
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock', 'macos/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Install Flutter Dependencies
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      # Same trim the build matrix does, with no `if:` because it applies to
      # both legs of this job. It used to run for Android only, so the iOS
      # smoke test booted an app carrying all six desktop binaries -- ~104 MB
      # that FlutterTorrentServerDesktop is not even registered to read on
      # iOS (see packages/flutter_torrent_server/pubspec.yaml).
      - name: Trim TorrServer Binaries
        run: rm -f packages/flutter_torrent_server/assets/torrserver/TorrServer-*

      # KVM, or the emulator falls back to software rendering and times out.
      - name: Enable KVM
        if: matrix.name == 'Android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke Test Android
        if: matrix.name == 'Android'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Not the minSdk floor (build.gradle.kts inherits Flutter's), but a
          # current API level with a google_apis image: the point of this leg is
          # that the plugins register cleanly on a device people actually run.
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          # Not the on-request suites (cloudstream/, clearance/, sign_in/, checks/, search/, device/); see the desktop smoke step.
          script: flutter test --no-pub $(find integration_test -name '*_test.dart' -not -path 'integration_test/cloudstream/*' -not -path 'integration_test/clearance/*' -not -path 'integration_test/sign_in/*' -not -path 'integration_test/checks/*' -not -path 'integration_test/search/*' -not -path 'integration_test/device/*')

      - name: Boot iOS Simulator
        if: matrix.name == 'iOS'
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; ds=json.load(sys.stdin)['devices']; \
                print(next(d['udid'] for k in ds for d in ds[k] if 'iPhone' in d['name']))")"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Smoke Test iOS
        if: matrix.name == 'iOS'
        # Not the on-request suites (cloudstream/, clearance/, sign_in/, checks/, search/, device/); see the desktop smoke step.
        run: |
          TESTS=()
          while IFS= read -r test; do TESTS+=("$test"); done \
            < <(find integration_test -name '*_test.dart' -not -path 'integration_test/cloudstream/*' -not -path 'integration_test/clearance/*' -not -path 'integration_test/sign_in/*' -not -path 'integration_test/checks/*' -not -path 'integration_test/search/*' -not -path 'integration_test/device/*' | sort)
          flutter test --no-pub "${TESTS[@]}" -d "$SIM_UDID"
